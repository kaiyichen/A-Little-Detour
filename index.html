<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Special Journey For Us 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--bg1:#fce7f3;--bg2:#f3e8ff;--card:#fffffff2;--ink:#334155;--muted:#64748b;--pink:#ec4899;--purple:#a855f7;--soft:#fdf2f8;--line:#fbcfe8;--sky:#e0f2fe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1233;--bg2:#1b1030;--card:#241a38f2;--ink:#f1e8ff;--muted:#b9a9d6;--soft:#33204a;--line:#6b3a82;--sky:#2b2a52}}
:root[data-theme="dark"]{--bg1:#2a1233;--bg2:#1b1030;--card:#241a38f2;--ink:#f1e8ff;--muted:#b9a9d6;--soft:#33204a;--line:#6b3a82;--sky:#2b2a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;justify-content:center;align-items:center;padding:12px;overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.card{width:100%;max-width:560px;background:var(--card);border:4px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 50px #a855f733}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#fff;background:linear-gradient(90deg,#f472b6,#fb7185,#c084fc);font-family:'Fredoka',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer;border:0}
.pill{background:#ffffff40;color:#fff;border-radius:99px;padding:6px 12px;font-size:12px}
.stage{position:relative;height:clamp(240px,44vh,360px);background:linear-gradient(var(--sky),var(--soft));border-bottom:2px solid var(--line)}
#three{position:absolute;inset:0;touch-action:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:92%;text-align:center;background:var(--card);color:var(--pink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;pointer-events:none;transition:opacity .4s}
#walk{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.arrows{display:flex;gap:8px}
.ctx{display:flex;flex-wrap:wrap;gap:8px}
.ctx button{padding:10px 14px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:600;animation:pop .3s ease}
#walk{min-height:64px;gap:10px}
.body.off{display:none}
.stage{touch-action:none}
#fade{position:absolute;inset:0;background:var(--card);opacity:0;pointer-events:none;transition:opacity .3s;z-index:1}
#reset{position:absolute;top:10px;right:10px;background:var(--card);color:var(--pink);border:1px solid var(--line);z-index:2}
.arrows button{width:44px;height:44px;border-radius:14px;background:var(--card);color:var(--pink);border:1px solid var(--line);font-size:18px;font-weight:700}
.arrows button:active{transform:scale(.93)}
.body{padding:24px 22px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.bubble{position:relative;border:2px solid var(--line);background:var(--soft);border-radius:18px;padding:18px;line-height:1.6;animation:pop .35s ease}
.bubble .tag{position:absolute;top:-12px;left:20px;background:var(--pink);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px}
.bubble.friend .tag{background:var(--purple)}
.bubble.center{text-align:center}.bubble.center .tag{left:50%;transform:translateX(-50%)}
.bubble h2{font-family:'Fredoka',sans-serif;margin:6px 0 8px;font-size:22px}
.bubble p{margin:0 0 8px}
.pink{color:var(--pink);font-weight:600}.purple{color:var(--purple);font-weight:600}
.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;min-height:64px;position:relative}
.btn{padding:12px 26px;border-radius:16px;color:#fff;font-weight:600;font-size:15px;background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 6px 16px #ec489944;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.yes{font-size:17px;font-weight:700;background:linear-gradient(90deg,#ec4899,#f43f5e);z-index:2}
.btn.no{background:#cbd5e1;color:#334155;font-size:13px;padding:10px 18px;box-shadow:none;transition:transform .25s}
.env{display:inline-block;padding:16px 22px;border:4px solid #f9a8d4;border-radius:18px;background:var(--card);cursor:pointer;animation:glow 2s infinite}
.env span{display:block;font-size:44px}.env small{font-weight:700;color:var(--pink);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:44px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.box{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:24px;width:100%;max-width:420px}
.box h3{font-family:'Fredoka',sans-serif;margin:0 0 6px;font-size:22px}
.box label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.box input{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;-webkit-user-select:text;user-select:text}
.box .row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.ghost{background:none;color:var(--muted);padding:10px 16px;font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{transform:scale(1);box-shadow:0 0 20px #f472b680}50%{transform:scale(1.05);box-shadow:0 0 34px #f472b6cc}}
@keyframes bob{50%{transform:translateY(-6px)}}
.bounce{animation:bob 1s infinite}
</style>
</head>
<body>
<div class="card">
  <div class="head"><span id="title">A Walk in the Park 🌳</span><button class="pill" id="settingsBtn">⚙️ Settings</button></div>
  <div class="stage"><div id="three"></div><div id="hint" style="opacity:0"></div><button class="pill" id="reset">⟲ Reset view</button><div id="fade"></div></div>
  <div id="walk">
    <div class="ctx" id="ctx"></div>
    <div class="arrows"><button id="bl" aria-label="Walk left">◀</button><button id="br" aria-label="Walk right">▶</button></div>
  </div>
  <div class="body off" id="bodyBox"><div id="dialog"></div><div class="actions" id="actions"></div></div>
</div>

<div class="modal" id="modal"><div class="box">
  <h3>✏️ Personalize Names</h3>
  <div style="font-size:13px;color:var(--muted)">Customize the names for your character (with glasses) and your best friend.</div>
  <label for="nYou">Your name</label><input id="nYou" maxlength="24">
  <label for="nFriend">Best friend’s name</label><input id="nFriend" maxlength="24">
  <div class="row"><button class="ghost" id="cancel">Cancel</button><button class="btn" id="save">Save &amp; Restart</button></div>
</div></div>

<script>

const LEFT=-8.5,RIGHT=9.6,START=-1;
let px=START,vel=0,dir=0,walkT=0,sit=false,kiteOn=false,petals=0,ctxKey="",yaw=0,pitch=.25,dist=6;
const focus=new THREE.Vector3(START+.7,1.1,0),ptr=new Map(),pk=new THREE.Vector3(),curFocus=new THREE.Vector3();
let cur,SC={},curName="park";
const fl=[];
const CHAT=[
 ["you","Hello!!"],["friend","HEYY!!"],["you","Long time no see man"],
 ["friend","YAA long time no see!"],["you","How has life been?"],
 ["friend","Yea good for me, how about you?"],
 ["you","Yea I’m good too!"],["friend","Btw, I have a gift for you..."]];
const SP={kite:{x:-1.8},bench:{x:-5.4},flower:{x:-7.6}};
const NO=["No","Are you sure?","Think again!","Nice try! 😜","Wrong button!","Not an option!","Click YES instead! 💕","Pretty please?","You can’t escape!"];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* audio (created lazily on first tap) */
let ac;
function chime(f=587.33,t="sine",d=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
 const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.08,ac.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const melody=()=>[523.25,659.25,783.99,1046.5].forEach((n,i)=>setTimeout(()=>chime(n,"sine",.25),i*120));
const boom=o=>{try{window.confetti&&confetti(o)}catch(e){}};

/* ---------- 3D scene ---------- */
let scene,cam,rend,you,youInner,friend,letter,clock,kite,kLine,sparkles=[],clouds=[],fly=[];
const M=(c,r=.7,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},x));
function add(g,m,x,y,z,parent){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(parent||scene).add(o);return o}
function avatar(hair,outfit,glasses){
 const g=new THREE.Group(),i=new THREE.Group();g.add(i);
 add(new THREE.ConeGeometry(.35,.8,16),M(outfit,.5),0,.5,0,i);
 add(new THREE.SphereGeometry(.28,16,16),M(0xfde68a,.4),0,1.15,0,i);
 const h=add(new THREE.SphereGeometry(.31,16,16),M(hair),0,1.2,-.05,i);h.scale.set(1.05,1.1,1.1);
 const lock=new THREE.CylinderGeometry(.07,.1,.6,8);
 add(lock,M(hair),-.22,.9,.04,i);add(lock,M(hair),.22,.9,.04,i);
 if(glasses){const r=new THREE.TorusGeometry(.07,.014,8,16),m=M(0x334155,.3,{metalness:.8});
  add(r,m,-.09,1.15,.25,i);add(r,m,.09,1.15,.25,i)}
 g.userData.inner=i;return g}
function tree(x,z,c=0x4ade80){const s=.9+Math.random()*.3;add(new THREE.CylinderGeometry(.14,.2,1.4*s,8),M(0x92400e,.9),x,.7*s,z);
 [[0,2.1,0,.85],[.45,1.7,.2,.6],[-.45,1.8,-.1,.65]].forEach(([dx,y,dz,r])=>add(new THREE.IcosahedronGeometry(r*s,1),M(c,.75,{flatShading:true}),x+dx*s,y*s,z+dz))}
function avatar2(hair,outfit,glasses,bun,low){
 const g=new THREE.Group(),i=new THREE.Group();g.add(i);
 const skin=M(0xffe0c2,.5),hm=M(hair,.55),om=M(outfit,.5);
 add(new THREE.ConeGeometry(.4,.85,24),om,0,.55,0,i);add(new THREE.SphereGeometry(.2,16,16),om,0,.98,0,i);
 const legG=new THREE.CylinderGeometry(.05,.05,.3,8),shoeG=new THREE.SphereGeometry(.09,10,10),fL=new THREE.Group(),fR=new THREE.Group();
 [[fL,-.1],[fR,.1]].forEach(([f,x])=>{f.position.set(x,0,0);i.add(f);add(legG,skin,0,.15,0,f);const s=add(shoeG,M(0x9f1239,.4),0,.05,.03,f);s.scale.set(1,.6,1.4)});
 const armG=new THREE.CylinderGeometry(.04,.04,.34,8),aL=new THREE.Group(),aR=new THREE.Group();
 [[aL,-.24],[aR,.24]].forEach(([a,x])=>{a.position.set(x,.98,0);i.add(a);add(armG,skin,0,-.15,0,a);add(new THREE.SphereGeometry(.05,8,8),skin,0,-.33,0,a)});
 add(new THREE.SphereGeometry(.3,24,24),skin,0,1.3,0,i);
 const hb=add(new THREE.SphereGeometry(.33,24,24),hm,0,1.34,-.07,i);hb.scale.set(1.05,1.08,1.05);
 const bang=add(new THREE.SphereGeometry(.32,24,12,0,Math.PI*2,0,Math.PI*.38),hm,0,1.34,.02,i);bang.rotation.x=.35;
 const lock=new THREE.CylinderGeometry(.08,.11,.75,10);if(!low){add(lock,hm,-.27,1.0,-.02,i);add(lock,hm,.27,1.0,-.02,i)}
 if(bun)add(new THREE.SphereGeometry(.14,12,12),hm,0,1.68,-.06,i);
 if(low){add(new THREE.SphereGeometry(.17,14,14),hm,0,1.12,-.34,i);add(new THREE.SphereGeometry(.05,8,8),M(0xfb7185),0,1.22,-.32,i)}
 const eye=new THREE.SphereGeometry(.035,8,8),em=M(0x1e293b,.3);add(eye,em,-.1,1.3,.28,i);add(eye,em,.1,1.3,.28,i);
 const ch=new THREE.SphereGeometry(.05,8,8),cm=M(0xfda4af,.6);add(ch,cm,-.17,1.22,.24,i).scale.set(1,.6,.4);add(ch,cm,.17,1.22,.24,i).scale.set(1,.6,.4);
 add(new THREE.SphereGeometry(.05,8,8),M(0xfb7185),.2,1.55,-.1,i).scale.set(1.6,1,.6);
 if(glasses){const r=new THREE.TorusGeometry(.08,.014,8,20),m=M(0x334155,.3,{metalness:.8});
  add(r,m,-.1,1.3,.3,i);add(r,m,.1,1.3,.3,i);add(new THREE.BoxGeometry(.06,.012,.012),m,0,1.31,.3,i)}
 g.userData={inner:i,aL,aR,fL,fR};return g}
function lamp(x,z){add(new THREE.CylinderGeometry(.05,.07,2.2,8),M(0x475569),x,1.1,z);
 add(new THREE.SphereGeometry(.2,12,12),M(0xfde68a,.3,{emissive:0xfbbf24,emissiveIntensity:.9}),x,2.3,z)}
function bench(x,z){add(new THREE.BoxGeometry(1.2,.1,.4),M(0xb45309),x,.5,z);add(new THREE.BoxGeometry(1.2,.4,.08),M(0xb45309),x,.8,z-.18);
 [-.5,.5].forEach(d=>add(new THREE.BoxGeometry(.08,.5,.35),M(0x78350f),x+d,.25,z))}
function init3d(){
 const c=$("three");
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0xe9d5ff,16,40);
 cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,.1,100);cam.position.set(px,2.5,6);
 rend=new THREE.WebGLRenderer({antialias:true,alpha:true});rend.setPixelRatio(Math.min(devicePixelRatio,2));rend.setSize(c.clientWidth,c.clientHeight);rend.shadowMap.enabled=true;rend.shadowMap.type=THREE.PCFSoftShadowMap;c.appendChild(rend.domElement);
 scene.add(new THREE.HemisphereLight(0xfff1f2,0xa7f3d0,.95));
 const d=new THREE.DirectionalLight(0xfff4e5,.85);d.position.set(4,12,9);d.castShadow=true;d.shadow.mapSize.set(2048,2048);
 Object.assign(d.shadow.camera,{left:-20,right:26,top:12,bottom:-12,near:1,far:50});d.shadow.bias=-.0005;scene.add(d);
 // sky, hills, clouds
 const sun=add(new THREE.SphereGeometry(1.2,24,24),M(0xfde68a,.3,{emissive:0xfbbf24,emissiveIntensity:.8}),12,9,-14);sun.castShadow=false;
 for(let i=-4;i<=6;i++){const h=add(new THREE.SphereGeometry(6,24,16),M(i%2?0x86efac:0xa7f3d0,1),i*9,-3.3,19+(i%2)*2);h.scale.y=.6;h.castShadow=false;const h2=add(new THREE.SphereGeometry(6,24,16),M(i%2?0xa7f3d0:0x86efac,1),i*9+4,-3.3,-10.5);h2.scale.y=.6;h2.castShadow=false}
 [[-10,-9,5,0x86efac],[0,-11,6,0xa7f3d0],[10,-10,5.5,0x86efac],[-20,-10,6,0xbbf7d0],[20,-11,6,0xa7f3d0],[-30,-11,6,0x86efac]].forEach(([x,z,r,c])=>{const h=add(new THREE.SphereGeometry(r,24,16),M(c,1),x,-r*.55,z);h.scale.y=.6;h.castShadow=false});
 for(let i=0;i<8;i++){const c=new THREE.Group();[[0,0,.8],[.8,-.1,.6],[-.8,-.1,.6],[.3,.3,.5]].forEach(([x,y,r])=>add(new THREE.SphereGeometry(r,12,12),M(0xffffff,1,{transparent:true,opacity:.92}),x,y,0,c));
  c.traverse(o=>o.castShadow=false);c.position.set(-22+i*6,6+Math.random()*2.5,-12-Math.random()*4);c.scale.setScalar(.8+Math.random()*.6);scene.add(c);clouds.push(c)}
 // path stones, bushes, wild flowers, butterflies
 for(let i=0;i<70;i++)add(new THREE.BoxGeometry(.45+Math.random()*.3,.04,.35),M([0xf5d0fe,0xfbcfe8,0xe9d5ff][i%3],.8),-13+i*.46,.03,-1.4+Math.random()*3);
 [[-1,-3.4],[2.4,-3.2],[-4.2,-3.3],[-8.2,-3.4],[5.6,-3.4],[-6.2,2.8],[8.5,-3.3],[12.5,-3.4],[14.8,-3],[7,2.9]].forEach(([x,z])=>[[0,0,.5],[.45,-.05,.38],[-.4,-.05,.4]].forEach(([dx,dy,r])=>add(new THREE.IcosahedronGeometry(r,1),M(0x34d399,.8,{flatShading:true}),x+dx,.3+dy,z)));
 for(let i=0;i<40;i++)add(new THREE.SphereGeometry(.07,6,6),M([0xf472b6,0xfacc15,0xffffff,0xc084fc][i%4]),-12+Math.random()*34,.08,2.4+Math.random()*2.2);
 for(let i=0;i<5;i++){const g=new THREE.Group(),wm=M([0xf472b6,0xfacc15,0xc084fc,0x60a5fa,0xfb923c][i],.5,{side:THREE.DoubleSide}),wg=new THREE.PlaneGeometry(.16,.12);
  const a=add(wg,wm,.08,0,0,g),b=add(wg,wm,-.08,0,0,g);a.rotation.x=b.rotation.x=-Math.PI/2.2;scene.add(g);fly.push({g,a,b,cx:-8+i*5,cz:.5+Math.random(),o:Math.random()*9})}
 const gr=add(new THREE.PlaneGeometry(80,40),M(0xa7f0bf,.95),2,-.05,0);gr.rotation.x=-Math.PI/2;
 add(new THREE.BoxGeometry(32,.08,3.2),M(0xf3e8ff,.8),3,-.02,.1);
 // park on the right: pond, picnic blanket, friend's bench
 const pond=add(new THREE.CircleGeometry(1.6,32),M(0x7dd3fc,.2,{metalness:.2}),14.2,.01,-2);pond.rotation.x=-Math.PI/2;
 add(new THREE.BoxGeometry(1.8,.03,1.2),M(0xfb7185),11,.02,.3);
 bench(11,-1.2);
 for(let i=0;i<26;i++)fl.push(add(new THREE.SphereGeometry(.1,8,8),M([0xf472b6,0xfacc15,0xffffff,0xc084fc][i%4]),-8.4+Math.random()*1.6,.12,2+Math.random()*.9));
 // park on the left
 bench(-5.4,-1.2);bench(-8,-1.2);lamp(-3.2,-1.4);lamp(-6.6,-1.4);lamp(-9,-1.4);lamp(8,-1.4);lamp(12.8,-1.4);
 [-4.5,-7.2,-9.5,-2,1.2].forEach((x,i)=>tree(x,-2.4-(i%2)*.6,i%2?0xf9a8d4:0x4ade80));
 tree(7.5,1.8);tree(-6,2.2);tree(-11.5,-2.6,0xf9a8d4);tree(6,-3.2,0xf9a8d4);tree(9,-3);tree(13,2.2);tree(15,-2.6,0xf9a8d4);tree(12.5,-3.6);
 // friend (no glasses) waiting at the café table
 friend=avatar2(0x1c1917,0xec4899,true,false);friend.position.set(11,.22,-1.1);friend.rotation.y=-.6;scene.add(friend);letter=emo(scene,"💌",11,1.4,-.5,.7);letter.visible=false;
 you=avatar2(0x78350f,0x9333ea,false,true);scene.add(you);
 kite=new THREE.Group();scene.add(kite);kite.position.set(SP.kite.x,.04,.8);kite.rotation.x=-Math.PI/2;
 const kd=add(new THREE.PlaneGeometry(.6,.6),M(0xf43f5e,.6,{side:THREE.DoubleSide}),0,0,0,kite);kd.rotation.z=Math.PI/4;
 [0xfacc15,0x38bdf8,0xf43f5e,0xfacc15].forEach((c,i)=>add(new THREE.BoxGeometry(.12,.08,.01),M(c),0,-.5-i*.18,0,kite));
 kLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0x64748b}));kLine.frustumCulled=false;kLine.visible=false;scene.add(kLine);
 const sg=new THREE.OctahedronGeometry(.09,0),sm=M(0xf472b6,.3,{emissive:0xfbcfe8});
 for(let i=0;i<14;i++){const m=add(sg,sm,-10+Math.random()*18,.6+Math.random()*2,-2+Math.random()*4);sparkles.push({m,o:Math.random()*10})}
 clock=new THREE.Clock();
 new ResizeObserver(()=>{const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;cam.aspect=w/h;cam.updateProjectionMatrix();rend.setSize(w,h)}).observe(c);
 loop()}
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(S.phase==="WALK"){
  vel+=((sit?0:dir)*2.4-vel)*Math.min(1,dt*8);               // smooth accel / decel
  px=Math.max(LEFT,Math.min(RIGHT,px+vel*dt));
  
  refreshCtx();
  
 }else vel=0;
 walkT+=Math.abs(vel)*dt*5;
 you.position.set(px,sit?.22:0,sit?-1.1:.25);
